daemonset:
  enabled: true

config:
  clients:
    - url: http://loki.monitoring-mdma.svc.cluster.local:3100/loki/api/v1/push

  snippets:
    extraRelabelConfigs:
      - source_labels:
          - __meta_kubernetes_namespace
        regex: (parcial-mdma|traefik)
        action: keep

      - source_labels:
          - __meta_kubernetes_namespace
        target_label: namespace

      - source_labels:
          - __meta_kubernetes_pod_name
        target_label: pod

      - source_labels:
          - __meta_kubernetes_pod_container_name
        target_label: container