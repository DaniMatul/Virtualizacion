apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: app1-route
  namespace: parcial-mdma
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`app1.mdma.local`)
      kind: Rule
      services:
        - name: app1-service
          port: 80

