apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: parcial-mdma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: nginx:alpine
          ports:
            - containerPort: 80